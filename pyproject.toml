[build-system]
requires = ["setuptools>=61.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "wordtidy"
version = "0.1.0"
description = "Small, dependency-free text helpers: slugify, truncate, word count and more."
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Miguel Louis", email = "miguellouis2023@gmail.com" }]
classifiers = [
  "Programming Language :: Python :: 3",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
]
requires-python = ">=3.8"
dependencies = []

[project.optional-dependencies]
dev = ["pytest", "build", "twine"]

[project.urls]
Homepage = "https://github.com/ZLouisMiguel/wordtidy"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]